services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-bot-backend-dev
    command: npm run dev
    ports:
      - "6102:6102"
    env_file:
      - ./backend/.env
    environment:
      PORT: 6102
      CORS_ORIGIN: http://localhost:6101
      WEBHOOK_URL: http://localhost:6102/api/webhook/interview-complete
      # DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/package.json:/app/package.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: voice-bot-frontend-dev
    command: npm run dev -- --host 0.0.0.0 --port 6101
    ports:
      - "6101:6101"
    environment:
      API_PROXY_TARGET: http://backend:6102
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/package.json:/app/package.json
    restart: unless-stopped
